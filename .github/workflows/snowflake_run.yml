name: Run SQL *WUX* with Snowflake CLI

on:
  # Pull requests into main that change SQL (runs the changed scripts)
  #pull_request:
  #  branches: [main]
  #  paths:
  #    - "sql/**.sql"
  schedule:
    - cron: '12 8 * * 5'

  # Runs once when SQL changes are merged (or pushed) to main
  push:
    branches: [main]
    paths:
      - "sql/**.sql"

  # Manual run from the Actions tab (pick a branch under "Use workflow from")
  workflow_dispatch:
    inputs:
      sql_files:
        description: "SQL files to run: list (comma or space separated), a folder, or a pattern like sql/prod/*.sql"
        required: true
        default: "sql/prod/test_table_1.sql"


permissions:
  contents: read

concurrency:
  group: snowflake-run-sql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-sql:
    runs-on: ubuntu-latest
    environment: snowflake-sandbox
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can work out which files changed

      - name: Work out which SQL files to run
        id: files
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FILES: ${{ github.event.inputs.sql_files }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            files=""
            missing=""
            # split the input on commas, spaces or new lines
            for token in $(echo "$INPUT_FILES" | tr ',' ' '); do
              token="${token%/}"
              if [ -d "$token" ]; then
                matches=$(find "$token" -maxdepth 1 -type f -name '*.sql' | sort)   # every .sql in the folder
              else
                matches=$(compgen -G "$token" | sort || true)                       # a file or a wildcard pattern
              fi
              if [ -z "$matches" ]; then
                missing="$missing $token"
              else
                files="$files"$'\n'"$matches"
              fi
            done
            if [ -n "$missing" ]; then
              echo "::error::SQL file(s) not found:$missing"
              exit 1
            fi
            files=$(echo "$files" | sed '/^$/d' | awk '!seen[$0]++')   # drop blanks and duplicates, keep order
          else
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BEFORE_SHA="HEAD~1"
            fi
            files=$(git diff --name-only --diff-filter=AMR "$BEFORE_SHA" HEAD -- 'sql/*.sql')
          fi
          if [ -z "$files" ]; then
            echo "::warning::No SQL files found - nothing will run in Snowflake."
          fi
          echo "Files to run:"
          echo "${files:-<none>}"
          {
            echo "list<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Snowflake CLI
        if: steps.files.outputs.list != ''
        uses: snowflakedb/snowflake-cli-action@v2

      - name: Run SQL scripts
        if: steps.files.outputs.list != ''
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
          FILES: ${{ steps.files.outputs.list }}
        run: |
          set -euo pipefail
          snow connection test -x
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::Running $f"
            snow sql -x -f "$f"
            echo "::endgroup::"
          done <<< "$FILES"
